 <div id="rlist"></div>`;rdraw();if(window.scrollTo)window.scrollTo(0,0)}
const MT={1:'ОРГАНИЗАЦИЯ ЗА ИЗВЪРШВАНЕ НА ТАКСИМЕТРОВ ПРЕВОЗ',2:'ЕКСПЛОАТАЦИЯ НА АВТОМОБИЛА',3:'РАБОТА С ТАКСИМЕТРОВ АПАРАТ',4:'АДМИНИСТРАТИВНОНАКАЗАТЕЛНА ОТГОВОРНОСТ',5:'БЕЗОПАСНОСТ НА ДВИЖЕНИЕТО'};
function rdraw(){const m=$('#rm').value,q=$('#rq').value.trim().toLowerCase();
 const list=D.q.filter(x=>(m=='0'||x.m==m)&&(!q||(x.s+' '+x.o.join(' ')).toLowerCase().includes(q)));
 const item=x=>`<div class="rq" data-m="${x.m}" data-n="${x.n}"><div class="qn">${x.n}. ${esc(x.s)}</div>${x.o.map((o,i)=>`<div class="ro${i===x.c?' ok':''}"><span class="box">${i===x.c?'☒':'☐'}</span><span>${esc(o)}</span></div>`).join('')}</div>`;
 let out=`<div class="mu" id="rcount">${list.length} ${list.length==1?'въпрос':'въпроса'}</div>`;
 if(!list.length)out+='<div class="card">Няма намерени въпроси.</div>';
 [1,2,3,4,5].forEach(k=>{const g=list.filter(x=>x.m==k);if(g.length)out+=`<h2 class="mh">МОДУЛ ${k}: ${MT[k]}</h2><div class="card rdoc">${g.map(item).join('')}</div>`});
 $('#rlist').innerHTML=out}
/* ---------- адреси ---------- */
function addrSetup(){
 const opts=D.addr.map((s,i)=>`<label class="chk"><input type="checkbox" class="ac" value="${i}" checked> ${s.title} <span class="mu">(${s.items.length})</span></label>`).join('');
 app.innerHTML=`<button class="btn sec" onclick="home()">← Начало</button><h1>Адреси</h1><div class="card"><h2>Категории</h2>${opts}</div>
 <div class="card"><div class="row"><span>Посока:</span><select id="dir"><option value="a">Обект → адрес</option><option value="b">Адрес → обект</option></select>
 <span>Брой:</span><select id="acnt"><option>10</option><option selected>20</option><option value="999">Всички</option></select></div></div>
 <button class="btn" onclick="addrStart()">Старт</button>`}
function addrStart(){const sel=[...document.querySelectorAll('.ac:checked')].map(e=>+e.value);if(!sel.length)return note('Избери категория.');
 const dir=$('#dir').value;let pool=[];sel.forEach(i=>D.addr[i].items.forEach(p=>pool.push({n:p[0],a:p[1],sec:i})));
 const n=Math.min(+$('#acnt').value,pool.length);
 const qs=sh(pool).slice(0,n).map(p=>{const same=D.addr[p.sec].items.filter(x=>x[0]!==p.n);const dis=sh(same).slice(0,3).map(x=>dir=='a'?x[1]:x[0]);
  const correct=dir=='a'?p.a:p.n;return {q:{m:'',s:dir=='a'?'Адрес на: '+p.n:'Чий е адресът: '+p.a,o:[correct,...dis],c:0,r:'Адреси'},ord:sh([0,1,2,3].slice(0,1+dis.length)),ans:null}});
 S={qs,i:0,fb:true,end:0,done:false};clearInterval(timer);show()}
/* ---------- маршрути ---------- */
function routes(){let i=0,open=false,list=D.routes;
 const draw=()=>{const r=list[i];app.innerHTML=`<div class="row"><button class="btn sec" onclick="home()">← Начало</button><span class="mu">Маршрут ${i+1} от ${list.length}</span></div>
  <div class="card"><div class="tag">От</div><b>${esc(r.a)}</b><div class="tag" style="margin-top:8px">До</div><b>${esc(r.b)}</b>
  ${open?`<ol class="steps">${r.steps.map(s=>`<li>${esc(s)}</li>`).join('')}</ol>`:`<p class="mu">Опитай първо да изброиш улиците наум, после покажи маршрута.</p>`}
  <button class="btn" onclick="window._t()">${open?'Скрий':'Покажи маршрута'}</button></div>
  <div class="row"><button class="btn sec" onclick="window._p()" ${i==0?'disabled':''}>← Назад</button><button class="btn sec" onclick="window._s()">Разбъркай</button><span class="sp"></span><button class="btn" onclick="window._n()" ${i==list.length-1?'disabled':''}>Напред →</button></div>`};
 window._t=()=>{open=!open;draw()};window._n=()=>{i++;open=false;draw()};window._p=()=>{i--;open=false;draw()};window._s=()=>{list=sh(D.routes);i=0;open=false;draw()};draw()}

/* ---------- реален изпит: част 1 ---------- */
function exam1(){const need={1:6,2:3,3:3,4:4,5:4};let qs=[];
 for(const m in need)qs.push(...sh(D.q.filter(q=>q.m==m)).slice(0,need[m]));
 begin(sh(qs),20,false,false);S.exam=true}
/* ---------- реален изпит: част 2 ---------- */
const STOP=new Set(['гр','софия','ул','бул','пл','блок','бл','улица','булевард','площад','ж','к','кв']);
const toks=s=>String(s).toLowerCase().replace(/([а-яa-z])(\d)/g,'$1 $2').replace(/(\d)([а-я]{2,})/g,'$1 $2').replace(/[„“”"'«»`.,;:()\/\\|\-–—]/g,' ').replace(/№/g,' ').split(/\s+/).filter(x=>x&&!STOP.has(x));
const isNum=x=>/^\d+[a-zа-я]?$/.test(x);
const sim=(w,t)=>t.some(x=>x===w||(w.length>=5&&x.length>=5&&x.slice(0,w.length-2)===w.slice(0,w.length-2)));
function addrOk(ans,corr){const t=toks(ans),c=toks(corr);if(!t.length)return false;
 const nums=c.filter(isNum).map(x=>parseInt(x)),tn=t.filter(isNum).map(x=>parseInt(x));
 const words=c.filter(x=>!isNum(x)&&x.length>=3);
 return nums.every(n=>tn.includes(n))&&(!words.length||words.filter(w=>sim(w,t)).length/words.length>=0.7)}
let P=null;
function exam2(){clearInterval(timer);S=null;
 app.innerHTML=`<button class="btn sec" onclick="home()">← Начало</button><h1>Изпит – Част 2 (писмено)</h1>
 <div class="card"><p>Ще получиш 3 институции, 3 хотела или обекта и 1 маршрут. Пишеш адресите и улиците по памет, без отговори за избор. Проверката сравнява улицата и номера, а ти можеш да коригираш ръчно всяка оценка.</p>
 <label class="chk"><input type="checkbox" id="p2t" checked> Ограничение във времето: 30 мин</label>
 <p class="mu">Официалният праг за допустими грешки в тази част не успях да потвърдя от официален източник. Питай Volt Academy или ДАИ.</p></div>
 <button class="btn" onclick="p2start()">Старт</button>`}
function p2start(){const pick=(cats,n)=>sh(cats.flatMap(i=>D.addr[i].items.map(p=>({n:p[0],a:p[1],cat:D.addr[i].title})))).slice(0,n);
 const lim=$('#p2t').checked;P={a:pick([0,1,2],3),b:pick([3,4,5],3),r:sh(D.routes)[0],done:false,end:lim?Date.now()+30*60000:0};
 const inp=(k,it)=>`<div class="card"><div class="tag">${esc(it.cat)}</div><b>${esc(it.n)}</b><input id="${k}" class="inp" type="text" placeholder="Напиши адреса по памет" autocomplete="off"></div>`;
 app.innerHTML=`<div class="row"><button class="btn sec" onclick="ask('Да прекратя ли?',()=>{clearInterval(timer);home()})">✕</button><span class="sp"></span><b id="clk"></b></div>
 <h2>Институции</h2>${P.a.map((it,i)=>inp('pa'+i,it)).join('')}
 <h2>Хотели и обекти</h2>${P.b.map((it,i)=>inp('pb'+i,it)).join('')}
 <h2>Маршрут</h2><div class="card"><div class="tag">От</div><b>${esc(P.r.a)}</b><div class="tag" style="margin-top:8px">До</div><b>${esc(P.r.b)}</b>
 <textarea id="pr" class="inp" rows="9" placeholder="Улиците по ред, по една на ред"></textarea></div>
 <button class="btn" onclick="ask('Да предам ли?',()=>p2finish())">Предай</button>`;
 clearInterval(timer);if(P.end){timer=setInterval(p2tick,1000);p2tick()}}
function p2tick(){if(!P||P.done)return;const left=P.end-Date.now();if(left<=0){p2finish();return}
 const el=$('#clk');if(el){el.textContent=Math.floor(left/60000)+':'+String(Math.floor(left/1000)%60).padStart(2,'0')}}
function p2finish(){if(!P||P.done)return;P.done=true;clearInterval(timer);closeDlg();
 P.a.forEach((it,i)=>{it.u=($('#pa'+i)||{}).value||'';it.ok=addrOk(it.u,it.a)});
 P.b.forEach((it,i)=>{it.u=($('#pb'+i)||{}).value||'';it.ok=addrOk(it.u,it.a)});
 P.r.u=($('#pr')||{}).value||'';P.rs=P.r.steps.map(s=>addrOk(P.r.u,s));P.rok=P.rs.filter(Boolean).length/P.r.steps.length>=0.8;p2result()}
function p2t(k,i){if(k=='r')P.rok=!P.rok;else P[k][i].ok=!P[k][i].ok;p2result()}
function p2result(){const all=[...P.a,...P.b];const score=all.filter(x=>x.ok).length+(P.rok?1:0);
 const row=(it,k,i)=>`<div class="card"><div class="tag">${esc(it.cat)}</div><b>${esc(it.n)}</b>
  <div class="${it.ok?'pass':'fail'}" style="margin-top:6px">${it.ok?'✔ Вярно':'✘ Грешно'}: ${esc(it.u||'(без отговор)')}</div><div class="pass">Верен адрес: ${esc(it.a)}</div>
  <button class="btn sec" style="margin-top:8px" onclick="p2t('${k}',${i})">${it.ok?'Отбележи като грешно':'Отбележи като вярно'}</button></div>`;
 const got=P.rs.filter(Boolean).length;
 app.innerHTML=`<div class="card"><div class="mu">Резултат – Част 2</div><div class="big">${score} от 7</div><div class="mu">6 адреса и 1 маршрут. Праг за успех: питай Volt Academy или ДАИ.</div></div>
 <div class="row"><button class="btn" onclick="home()">Начало</button><button class="btn sec" onclick="exam2()">Нов опит</button></div>
 <h2>Институции</h2>${P.a.map((it,i)=>row(it,'a',i)).join('')}<h2>Хотели и обекти</h2>${P.b.map((it,i)=>row(it,'b',i)).join('')}
 <h2>Маршрут</h2><div class="card"><b>${esc(P.r.a)} → ${esc(P.r.b)}</b>
  <div class="${P.rok?'pass':'fail'}" style="margin-top:6px">${P.rok?'✔ Вярно':'✘ Грешно'}: засечени ${got} от ${P.r.steps.length} улици</div>
  <div class="tag" style="margin-top:8px">Твоят отговор</div><div style="white-space:pre-wrap">${esc(P.r.u||'(без отговор)')}</div>
  <div class="tag" style="margin-top:8px">Верен маршрут</div><ol class="steps">${P.r.steps.map((s,i)=>`<li class="${P.rs[i]?'pass':'fail'}">${P.rs[i]?'✔':'✘'} ${esc(s)}</li>`).join('')}</ol>
  <button class="btn sec" onclick="p2t('r',0)">${P.rok?'Отбележи като грешно':'Отбележи като вярно'}</button></div>`}
home();
</script></body></html>
